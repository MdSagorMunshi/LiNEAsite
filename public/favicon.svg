<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Background Midnight Obsidian -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Specular Rim Gradient: Ice Sapphire to Electric Indigo & Titanium Gold -->
    <linearGradient id="fav-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#0EA5E9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D4A359" stop-opacity="0.85" />
    </linearGradient>

    <!-- Ambient Liquid Sapphire Glow -->
    <radialGradient id="fav-glow" cx="30%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Handset Surface Gradient -->
    <linearGradient id="fav-phone" x1="20%" y1="10%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Signal Arc Gradient -->
    <linearGradient id="fav-signal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Base Crystal Plate (Rounded Squircle) -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="url(#fav-bg)" />
  
  <!-- Ambient Liquid Glow -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="url(#fav-glow)" />

  <!-- Top Glass Highlight Shelf -->
  <path d="M 2 8.5 C 2 4.5 4.5 2 8.5 2 L 23.5 2 C 27.5 2 30 4.5 30 8.5 C 30 9.5 25 12 16 12 C 7 12 2 9.5 2 8.5 Z" fill="#FFFFFF" fill-opacity="0.06" />

  <!-- Specular Outer Rim -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="none" stroke="url(#fav-rim)" stroke-width="1.2" />

  <!-- Inner Bevel Border -->
  <rect x="2.4" y="2.4" width="27.2" height="27.2" rx="6.1" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.6" />

  <!-- Core Mark: Cellular Handset Receiver -->
  <path d="M10.8 8.8 C10.2 8.2 9.2 8.2 8.5 8.8 L7.4 9.8 C6.8 10.3 6.6 11.1 6.7 11.9 C7.2 14.4 8.9 18.0 12.1 21.2 C15.3 24.4 18.9 26.1 21.4 26.6 C22.2 26.7 23.0 26.5 23.5 25.9 L24.5 24.8 C25.1 24.1 25.1 23.1 24.5 22.5 L22.1 20.1 C21.5 19.5 20.5 19.5 19.8 20.1 L19.1 20.7 C18.7 21.0 18.1 21.1 17.6 20.7 C16.2 19.7 14.3 17.8 13.3 16.4 C12.9 15.9 13.0 15.3 13.3 14.9 L13.9 14.2 C14.5 13.5 14.5 12.5 13.9 11.9 Z" 
        fill="url(#fav-phone)" />

  <!-- Titanium Gold Security Hardware Dot -->
  <circle cx="9.8" cy="10.2" r="1.1" fill="#D4A359" />

  <!-- Concentric Encrypted Signal Waves -->
  <path d="M 18.7 9.6 A 7.5 7.5 0 0 1 16.3 17.2" 
        fill="none" 
        stroke="url(#fav-signal)" 
        stroke-width="1.8" 
        stroke-linecap="round" />
  <path d="M 22.8 7.4 A 12.0 12.0 0 0 1 18.4 21.3" 
        fill="none" 
        stroke="url(#fav-signal)" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        stroke-opacity="0.78" />
</svg>