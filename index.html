    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is LiNEA free and open source?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. LiNEA is free forever, licensed under Apache 2.0, with source code published on GitHub. There are no ads, subscriptions, in-app purchases or paid tiers."
            }
          },
          {
            "@type": "Question",
            "name": "Which Android versions does LiNEA support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "LiNEA targets Android 17 (API 37) and runs on Android 11 and newer. It is built directly on the native Android telecom framework, so no third-party call libraries are involved."
            }
          },
          {
            "@type": "Question",
            "name": "Does LiNEA send any data to the cloud?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. LiNEA is 100% on-device with zero cloud dependency and zero telemetry. Contacts, call logs and settings never leave the phone."
            }
          },
          {
            "@type": "Question",
            "name": "How do I install LiNEA?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Download the APK, allow install from unknown apps for your file manager, open the APK, then set LiNEA as the default dialer. Advanced users can sideload with ADB: adb install -r LiNEA.apk, then adb shell telecom set-default-dialer com.ryanshelby.linea."
            }
          },
          {
            "@type": "Question",
            "name": "How can I verify the APK before installing?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Every release publishes SHA-256 checksums for all APK assets. Compare the checksum of your downloaded file against the value shown in the Downloads section, or use the built-in verification terminal which generates the exact certutil/sha256sum command."
            }
          },
          {
            "@type": "Question",
            "name": "Where do the downloads come from?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "All builds are attached to GitHub Releases in the MdSagorMunshi/Linea repository. This site lists every asset of every tag directly and stays in sync automatically."
            }
          }
        ]
      }
